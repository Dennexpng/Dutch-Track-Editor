name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  export-android:
    name: Exporteer Android APK
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Export-templates installeren
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Build-tools 34 installeren
        run: |
          SM=$(find / -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SM" ]; then
            mkdir -p /root/android-sdk/cmdline-tools
            curl -sSL -o /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/ct.zip -d /root/android-sdk/cmdline-tools
            mv /root/android-sdk/cmdline-tools/cmdline-tools /root/android-sdk/cmdline-tools/latest
            SM=/root/android-sdk/cmdline-tools/latest/bin/sdkmanager
          fi
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "build-tools;34.0.0" "platforms;android-34" "platform-tools"

      - name: Android instellen
        run: |
          SDK=""
          for p in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/lib/android-sdk /root/android-sdk /opt/android-sdk; do
            if [ -n "$p" ] && [ -d "$p/platform-tools" ]; then SDK="$p"; break; fi
          done
          JAVA=$(dirname "$(dirname "$(readlink -f "$(which javac)")")")
          KEY=/root/debug.keystore
          if [ ! -f "$KEY" ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey \
              -keypass android -keystore "$KEY" -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999 \
              -deststoretype pkcs12
          fi
          echo "SDK=$SDK"
          echo "JAVA=$JAVA"
          ls "$SDK" || true
          ls "$SDK/cmdline-tools" || true
          ls "$SDK/build-tools" || true
          mkdir -p ~/.config/godot
          for f in ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.3.tres; do
            {
              echo '[gd_resource type="EditorSettings" format=3]'
              echo ''
              echo '[resource]'
              echo "export/android/android_sdk_path = \"$SDK\""
              echo "export/android/java_sdk_path = \"$JAVA\""
              echo "export/android/debug_keystore = \"$KEY\""
              echo 'export/android/debug_keystore_user = "androiddebugkey"'
              echo 'export/android/debug_keystore_pass = "android"'
            } > "$f"
          done

      - name: Project importeren
        run: godot --headless --import || true

      - name: APK bouwen
        run: |
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/spoorsandbox.apk

      - name: APK uploaden als artifact
        uses: actions/upload-artifact@v4
        with:
          name: spoorsandbox-apk
          path: build/android/spoorsandbox.apk
          if-no-files-found: error
