name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  SDK: /root/android-sdk

jobs:
  export-android:
    name: Exporteer Android APK
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Export-templates installeren
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable | grep -i android || echo "GEEN ANDROID TEMPLATES"

      - name: Android SDK installeren
        run: |
          mkdir -p $SDK/cmdline-tools
          curl -sSL -o /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/ct.zip -d $SDK/cmdline-tools
          mv $SDK/cmdline-tools/cmdline-tools $SDK/cmdline-tools/latest
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK --licenses > /dev/null || true
          $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          ls $SDK $SDK/build-tools $SDK/platform-tools | head -n 40

      - name: Android instellen
        run: |
          JAVA=$(dirname "$(dirname "$(readlink -f "$(which javac)")")")
          KEY=/root/debug.keystore
          if [ ! -f "$KEY" ]; then
            keytool -keyalg RSA -genkeypair -alias andr
