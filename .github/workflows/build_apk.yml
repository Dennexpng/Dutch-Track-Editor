name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  export-android:
    name: Exporteer Android APK
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Export-templates installeren
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Debug-keystore aanmaken
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 \
            -deststoretype pkcs12

      - name: Godot-editorinstellingen voor Android
        run: |
          godot --headless --editor --quit || true
          SETTINGS=$(ls ~/.config/godot/editor_settings-4*.tres | head -n 1)
          {
            echo 'export/android/android_sdk_path = "'"${ANDROID_HOME:-/root/android-sdk}"'"'
            echo 'export/android/java_sdk_path = "'"${JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-amd64}"'"'
            echo 'export/android/debug_keystore = "'"${GITHUB_WORKSPACE}"'/debug.keystore"'
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } >> "$SETTINGS"

      - name: Project importeren
        run: godot --headless --import || true

      - name: APK bouwen
        run: |
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/spoorsandbox.apk

      - name: APK uploaden als artifact
        uses: actions/upload-artifact@v4
        with:
          name: spoorsandbox-apk
          path: build/android/spoorsandbox.apk
          if-no-files-found: error
